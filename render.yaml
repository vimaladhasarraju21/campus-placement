# One-click backend + database on Render:  New + > Blueprint > pick this GitHub repo.
services:
  - type: web
    name: campus-placement-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn placement_system.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: campus-placement-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # you type this in the Render dashboard
      - key: FRONTEND_URL
        sync: false          # paste your Vercel link here after step 2

databases:
  - name: campus-placement-db
    plan: free
    databaseName: campus_placement
